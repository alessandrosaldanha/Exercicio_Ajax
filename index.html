<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="./Image/Orla.1.JPG" alt="Avatar" id="avatar">
            <h1 class="profile-name">Alessandro Vital Saldanha</h1>
            <h2 class="profile-username">@alessandrosaldanha</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repos">5</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers">5</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following">5</span>
                </li>
            </ul>
            <a href="https://github.com/alessandrosaldanha" id="github-link" class="profile-link">Ver no Github</a>
        </div>
    </header>
    
    <div class="github-stats">
        <img src="https://github-readme-stats.vercel.app/api?username=alessandrosaldanha&show_icons=true&theme=dark" alt="GitHub Stats">
        <img src="https://github-readme-streak-stats.herokuapp.com/?user=alessandrosaldanha&theme=dark" alt="GitHub Streak Stats">
        <img src="https://github-readme-stats.vercel.app/api/top-langs/?username=alessandrosaldanha&layout=compact&theme=dark" alt="Linguagens mais usadas">
    </div>
    
    <script src="main.js"></script>
</body>
</html>
